, "space-md": "1.25rem" }, fontFamily: { "headline-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "display-lg-mobile": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"] }, fontSize: { "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }], "headline-md": ["22px", { "lineHeight": "30px", "fontWeight": "600" }], "label-md": ["13px", { "lineHeight": "18px", "fontWeight": "500" }], "headline-sm": ["18px", { "lineHeight": "26px", "fontWeight": "600" }], "display-lg-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "26px", "fontWeight": "400" }], "body-sm": ["12px", { "lineHeight": "18px", "fontWeight": "400" }], "label-sm": ["11px", { "lineHeight": "16px", "fontWeight": "600" }], "label-lg": ["15px", { "lineHeight": "20px", "fontWeight": "600" }], "display-lg": ["40px", { "lineHeight": "48px", "fontWeight": "700" }], "body-md": ["14px", { "lineHeight": "22px", "fontWeight": "400" }] } } } };</script><style>@layer base { html, body { width: 100%; margin: 0; padding: 0; min-height: 100vh; } body { overscroll-behavior-y: none; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } } ::-webkit-scrollbar { display: none; }</style><style>

ver" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCcX8XpdXlA1Kf-29aP1Yt1kwQtup4n3VXe4jJTpyZM4v9TC51TPxE7tPJ0z9Y7bAUOFxoGgYsU4r_cuQkop5eEYwThm-QYbYVqBxsISIGiislt_4L0cCNnOAJJ6sL06AkOZNo1Dov8TdZPWu1ZkJcARMKS7Mt3SEmHesyyZFJjoDyt1iD16YPn2KfOD7hhp8x8rp0VSXnnKI2pAfSu5puQKUmg3vpUxjkaWqILU_OY"/></button></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface px-margin"><div class="flex flex-col w-full pb-8">
<div class="flex flex-col gap-space-sm pt-2">
<div class="flex items-center justify-between">
<span class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1.5">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
        Sessão Zen Ativa
      </span>
<div class="flex items-center gap-1 bg-surface-container-high px-2.5 py-1 rounded-full text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-primary">timer</span>
<span class="font-label-sm text-label-sm font-semibold tracking-wider text-on-surface" id="session-timer">03:00</span>
</div>
</div>
<!-- Seletor de Ritmo -->
<div class="flex items-center gap-2 p-1 bg-surface-container-low rounded-full">
<button class="flex-1 py-2 px-3 rounded-full bg-primary-container text-on-primary-container font-label-md text-label-md font-semibold transition-all flex items-center justify-center gap-1.5 shadow-sm" id="mode-square" onclick="switchMode('square')" type="button">
<span class="material-symbols-outlined text-[18px]">crop_square</span>
<span>Ritmo 4-4-4</span>
</button>
<button class="flex-1 py-2 px-3 rounded-full text-on-surface-variant hover:text-on-surface font-label-md text-label-md transition-all flex items-center justify-center gap-1.5" id="mode-gentle" onclick="switchMode('gentle')" type="button">
<span class="material-symbols-outlined text-[18px]">air</span>
<span>Suave 4-6</span>
</button>
</div>
</div>
<!-- Barra Linear Discreta da Sessão -->
<div class="w-full bg-surface-container-high h-1.5 rounded-full mt-4 overflow-hidden">
<div class="bg-primary h-full rounded-full transition-all duration-300 w-0" id="session-progress"></div>
</div>
<!-- Orbe Central Hipnótico e Respiração -->
<div class="relative flex flex-col items-center justify-center my-6 min-h-[340px] select-none">
<!-- Aura de fundo bioluminescente -->
<div class="absolute w-72 h-72 rounded-full bg-primary/10 blur-3xl pointer-events-none"></div>
<div class="absolute w-56 h-56 rounded-full bg-secondary-container/20 blur-2xl pointer-events-none"></div>
<!-- Anéis concêntricos com animação via JS / CSS transforms -->
<div class="relative flex items-center justify-center w-64 h-64">
<div class="absolute w-64 h-64 rounded-full bg-primary/5 transition-transform duration-1000 ease-in-out scale-95" id="orb-ring-outer"></div>
<div class="absolute w-52 h-52 rounded-full bg-primary/10 transition-transform duration-1000 ease-in-out scale-90" id="orb-ring-mid"></div>
<div class="absolute w-40 h-40 rounded-full bg-gradient-to-tr from-surface-container-highest via-primary-container/20 to-primary/30 backdrop-blur-md shadow-xl flex flex-col items-center justify-center transition-transform duration-1000 ease-in-out" id="orb-ring-inner">
<span class="font-display-lg text-display-lg text-primary tracking-tight font-bold transition-all" id="countdown-num">4</span>
</div>
</div>
<!-- Feedback e Guia da Fase -->
<div class="text-center mt-6 flex flex-col items-center max-w-xs">
<span class="font-label-sm text-label-sm uppercase tracking-widest text-primary font-semibold px-3 py-1 rounded-full bg-primary-container/15 mb-2" id="phase-badge">
        INSPIRE SUAVEMENTE
      </span>
<p class="font-body-md text-body-md text-on-surface-variant transition-opacity duration-300" id="phase-instruction">
        Puxe o ar pelo nariz, sem pressa
      </p>
</div>
</div>
<!-- Seletor de Som de Fundo Zen -->
<div class="bg-surface-container-low rounded-xl p-space-sm mb-6 flex items-center justify-between shadow-sm">
<div class="flex items-center gap-space-sm">
<div class="w-9 h-9 rounded-full bg-surface-container-high flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[20px]" id="sound-icon">water_drop</span>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md font-semibold text-on-surface">Trilha Sonora</span>
<span class="font-body-sm text-body-sm text-on-surface-variant" id="sound-name">Chuva Suave · 432Hz</span>
</div>
</div>
<div class="flex items-center gap-1.5">
<button class="h-8 px-3 rounded-full bg-surface-container-high hover:bg-surface-container text-on-surface-variant hover:text-on-surface font-label-sm text-label-sm font-semibold flex items-center gap-1 transition-colors" onclick="cycleSound()" type="button">
<span class="material-symbols-outlined text-[15px]">swap_horiz</span>
        Mudar
      </button>
<button class="w-8 h-8 rounded-full bg-primary-container/20 text-primary flex items-center justify-center transition-colors" id="sound-toggle" onclick="toggleMute()" type="button">
<span class="material-symbols-outlined text-[18px]" id="mute-icon">volume_up</span>
</button>
</div>
</div>
<!-- Cartão de Apoio Terapêutico -->
<div class="bg-surface-container rounded-xl p-space-sm mb-6 flex items-start gap-space-sm">
<span class="material-symbols-outlined text-tertiary text-[22px] mt-0.5">spa</span>
<div class="flex flex-col">
<span class="font-label-md text-label-md font-semibold text-tertiary">Ancoragem Somática</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">
        Mantenha os ombros relaxados e permita que o abdômen se expanda suavemente a cada inspiração.
      </p>
</div>
</div>
<!-- Controles Inferiores do Player -->
<div class="flex items-center justify-between gap-space-sm mt-auto pt-2">
<!-- Reiniciar -->
<button class="flex-1 py-3 px-3 rounded-xl bg-surface-container-low text-on-surface-variant hover:text-on-surface flex flex-col items-center justify-center gap-1 active:scale-95 transition-all" onclick="resetSession()" type="button">
<span class="material-symbols-outlined text-[20px]">restart_alt</span>
<span class="font-label-sm text-label-sm">Reiniciar</span>
</button>
<!-- Botão Central Play / Pausa -->
<button class="flex-[1.5] py-3.5 px-4 rounded-xl bg-primary text-on-primary font-headline-sm text-headline-sm flex items-center justify-center gap-2 shadow-lg hover:opacity-95 active:scale-95 transition-all" id="main-play-btn" onclick="togglePlay()" type="button">
<span class="material-symbols-outlined text-[26px]" id="play-btn-icon" style="font-variation-settings: 'FILL' 1;">pause</span>
<span class="font-label-lg text-label-lg" id="play-btn-text">Pausar</span>
</button>
<!-- Concluir -->
<button class="flex-1 py-3 px-3 rounded-xl bg-surface-container-low text-on-surface-variant hover:text-on-surface flex flex-col items-center justify-center gap-1 active:scale-95 transition-all" onclick="finishSession()" type="button">
<span class="material-symbols-outlined text-[20px]">check_circle</span>
<span class="font-label-sm text-label-sm">Concluir</span>
</button>
</div>
</div>
<script>
  let isRunning = true;
  let currentMode = 'square'; // 'square' (4-4-4) or 'gentle' (4-6)
  let totalSessionSeconds = 180;
  let elapsedSeconds = 0;
  let cycleTimer = 4;
  let phaseIndex = 0;
  let isMuted = false;
  let soundIndex = 0;

  const sounds = [
    { name: "Chuva Suave · 432Hz", icon: "water_drop" },
    { name: "Sons da Floresta · Zen", icon: "forest" },
    { name: "Ondas do Oceano", icon: "waves" },
    { name: "Silêncio Puro", icon: "volume_off" }
  ];

  const modes = {
    square: {
      phases: [
        { name: "INSPIRE SUAVEMENTE", tip: "Puxe o ar pelo nariz, sem pressa", duration: 4, scale: "scale-125" },
        { name: "RETENHA O AR", tip: "Mantenha o ar nos pulmões com serenidade", duration: 4, scale: "scale-125" },
        { name: "EXPIRE LENTAMENTE", tip: "Solte o ar suavemente pela boca", duration: 4, scale: "scale-90" }
      ]
    },
    gentle: {
      phases: [
        { name: "INSPIRE SUAVEMENTE", tip: "Encha o peito de ar com calma", duration: 4, scale: "scale-125" },
        { name: "EXPIRE PROFUNDAMENTE", tip: "Esvazie devagar, liberando qualquer tensão", duration: 6, scale: "scale-85" }
      ]
    }
  };

  const orbOuter = document.getElementById('orb-ring-outer');
  const orbMid = document.getElementById('orb-ring-mid');
  const orbInner = document.getElementById('orb-ring-inner');
  const countDisplay = document.getElementById('countdown-num');
  const badgeDisplay = document.getElementById('phase-badge');
  const instructionDisplay = document.getElementById('phase-instruction');
  const timerDisplay = document.getElementById('session-timer');
  const progressBar = document.getElementById('session-progress');
  const playBtnIcon = document.getElementById('play-btn-icon');
  const playBtnText = document.getElementById('play-btn-text');

  function updateVisualOrb() {
    const activePhases = modes[currentMode].phases;
    const currentPhase = activePhases[phaseIndex];

    badgeDisplay.textContent = currentPhase.name;
    instructionDisplay.textContent = currentPhase.tip;
    countDisplay.textContent = cycleTimer;

    const scaleClass = currentPhase.scale;
    orbOuter.className = `absolute w-64 h-64 rounded-full bg-primary/5 transition-transform duration-1000 ease-in-out ${scaleClass}`;
    orbMid.className = `absolute w-52 h-52 rounded-full bg-primary/10 transition-transform duration-1000 ease-in-out ${scaleClass}`;
    orbInner.className = `absolute w-40 h-40 rounded-full bg-gradient-to-tr from-surface-container-highest via-primary-container/20 to-primary/30 backdrop-blur-md shadow-xl flex flex-col items-center justify-center transition-transform duration-1000 ease-in-out ${scaleClass}`;
  }

  function tick() {
    if (!isRunning) return;

    if (elapsedSeconds < totalSessionSeconds) {
      elapsedSeconds++;
      const remaining = totalSessionSeconds - elapsedSeconds;
      const m = String(Math.floor(remaining / 60)).padStart(2, '0');
      const s = String(remaining % 60).padStart(2, '0');
      timerDisplay.textContent = `${m}:${s}`;
      progressBar.style.width = `${(elapsedSeconds / totalSessionSeconds) * 100}%`;
    }

    cycleTimer--;
    if (cycleTimer <= 0) {
      const activePhases = modes[currentMode].phases;
      phaseIndex = (phaseIndex + 1) % activePhases.length;
      cycleTimer = activePhases[phaseIndex].duration;
    }

    updateVisualOrb();
  }

  const intervalId = setInterval(tick, 1000);

  function togglePlay() {
    isRunning = !isRunning;
    if (isRunning) {
      playBtnIcon.textContent = 'pause';
      playBtnText.textContent = 'Pausar';
    } else {
      playBtnIcon.textContent = 'play_arrow';
      playBtnText.textContent = 'Retomar';
    }
  }

  function resetSession() {
    elapsedSeconds = 0;
    phaseIndex = 0;
    cycleTimer = modes[currentMode].phases[0].duration;
    timerDisplay.textContent = '03:00';
    progressBar.style.width = '0%';
    updateVisualOrb();
  }

  function switchMode(mode) {
    if (currentMode === mode) return;
    currentMode = mode;
    phaseIndex = 0;
    cycleTimer = modes[currentMode].phases[0].duration;

    const btnSquare = document.getElementById('mode-square');
    const btnGentle = document.getElementById('mode-gentle');

    if (mode === 'square') {
      btnSquare.className = "flex-1 py-2 px-3 rounded-full bg-primary-container text-on-primary-container font-label-md text-label-md font-semibold transition-all flex items-center justify-center gap-1.5 shadow-sm";
      btnGentle.className = "flex-1 py-2 px-3 rounded-full text-on-surface-variant hover:text-on-surface font-label-md text-label-md transition-all flex items-center justify-center gap-1.5";
    } else {
      btnGentle.className = "flex-1 py-2 px-3 rounded-full bg-primary-container text-on-primary-container font-label-md text-label-md font-semibold transition-all flex items-center justify-center gap-1.5 shadow-sm";
      btnSquare.className = "flex-1 py-2 px-3 rounded-full text-on-surface-variant hover:text-on-surface font-label-md text-label-md transition-all flex items-center justify-center gap-1.5";
    }

    updateVisualOrb();
  }

  function cycleSound() {
    soundIndex = (soundIndex + 1) % sounds.length;
    document.getElementById('sound-name').textContent = sounds[soundIndex].name;
    document.getElementById('sound-icon').textContent = sounds[soundIndex].icon;
  }

  function toggleMute() {
    isMuted = !isMuted;
    const icon = document.getElementById('mute-icon');
    const btn = document.getElementById('sound-toggle');
    if (isMuted) {
      icon.textContent = 'volume_off';
      btn.className = "w-8 h-8 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center transition-colors";
    } else {
      icon.textContent = 'volume_up';
      btn.className = "w-8 h-8 rounded-full bg-primary-container/20 text-primary flex items-center justify-center transition-colors";
    }
  }

  function finishSession() {
    isRunning = false;
    badgeDisplay.textContent = 'SESSÃO CONCLUÍDA';
    instructionDisplay.textContent = 'Excelente trabalho! Sinta a calma em seu corpo.';
    countDisplay.textContent = '✓';
    playBtnIcon.textContent = 'play_arrow';
    playBtnText.textContent = 'Reiniciar';
  }

  updateVisualOrb();
</script></main></body></html>
